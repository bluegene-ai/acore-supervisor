; ===========================================================================================
;  supervisor.ini - configuration for acore_supervisor.exe
; ===========================================================================================
;  Relative paths are resolved against the folder that contains THIS file.
;  Precedence: built-in defaults  <  this file.
;  Run "acore_supervisor.exe --once" to verify paths, log files and probes without starting
;  anything.
; ===========================================================================================

[general]
; supervisor's own log (rotated at GuardLogMaxMB) and machine readable status
GuardLog        = logs\supervisor.log
GuardLogMaxMB   = 16
StatusFile      = logs\supervisor_status.json
StatusEnabled   = true

; command drop box used by the AGMP panel ("supervisor" page):
;   id=<unique>  action=start|stop|restart|ping|shutdown  target=worldserver|authserver|all
; The supervisor renames the file to <file>.running before executing it, so a command can never
; run twice, and it publishes the outcome as "lastCommand" in the status file.
ControlFile     = logs\supervisor_control.txt

; false = keep the supervisor alive (and controllable from the panel) after every service
;         stopped cleanly; true = exit once nothing is left to run
ExitWhenAllStopped = false

; single-instance name; change it if you ever run two supervisors on one machine
InstanceName    = Acore80

; main loop tick (ms). Death of a server is detected by an event, not by this tick.
TickMs          = 500


; ===========================================================================================
;  worldserver - health comes from the WORLD LOOP's own heartbeat line in Server.log
; ===========================================================================================
;  AzerothCore writes it from inside the world update loop
;  (World::Update -> WorldUpdateTime::RecordUpdateTime, UpdateTime.cpp:163-177):
;
;      Update time diff: 12ms with 7 players online
;      Last 500 diffs summary:
;      |- Mean: 10ms
;      ...
;
;  For it to appear once a minute (and not only on lag spikes) worldserver.conf needs:
;      RecordUpdateTimeDiffInterval = 60000
;      MinRecordUpdateTimeDiff      = 0
;  (already set in this deployment).  Because the line is produced by the world loop itself,
;  a chatty background logger can no longer hide a frozen world loop.
; ===========================================================================================

[worldserver]
Enabled                  = true
Role                     = world
WorkDir                  = ..\80
Exe                      = worldserver.exe
Args                     =
; auto = take LogsDir + the file appender name out of the server's own config (recommended,
;        so the supervisor always watches the file the server actually writes)
LogFile                  = auto
ServerConf               = configs\worldserver.conf

; the world-loop heartbeat and the "startup finished" marker
HeartbeatPattern         = Update time diff:
StartupReadyPattern      = World Initialized In

; health thresholds (seconds)
HeartbeatTimeoutSeconds  = 180
StartupTimeoutSeconds    = 900
StartupStallSeconds      = 300
StartupGraceSeconds      = 60
PollSeconds              = 15

; stop / restart policy
StopGraceSeconds         = 25
RestartDelaySeconds      = 10
PlannedRestartDelaySeconds = 15
MaxBackoffSeconds        = 600
StableRunSeconds         = 300
MaxRestartsPerHour       = 0
AutoRestartOnCleanExit   = false
AdoptExisting            = true

; CPU-time progress is used as a cross-check when the log signal is unavailable
CpuCrossCheck            = true
RequireHeartbeat         = true

; restart if the process ever exceeds this working set (0 = disabled)
MaxWorkingSetMB          = 0

; shared = the server writes into this supervisor window (GM command line keeps working)
; own    = the server gets its own console window titled by Windows
; hidden = no console (only for servers you never type into)
Console                  = shared

; optional extra liveness check for worldserver (0 = off; authserver uses this by default)
ProbePort                = 0


; ===========================================================================================
;  authserver - has no log heartbeat, so it is probed over TCP
; ===========================================================================================
;  ProbeMode = auth  (default, strong and silent):
;      connect to RealmServerPort and send one AUTH_LOGON_CHALLENGE for a random NON-EXISTENT
;      account.  The server answers AUTH_LOGON_CHALLENGE + WOW_FAIL_UNKNOWN_ACCOUNT, which
;      proves the acceptor, the packet handler and a login-DB round trip work
;      (AuthSession.cpp:322-330).  It writes nothing to Auth.log, counts no failed login and
;      triggers no WrongPass ban.
;      The challenge packet is hand built, so it must match sAuthLogonChallenge_C exactly:
;      `size` is a native (little endian) uint16 equal to 30 + account length, and `build` is
;      little endian too.  A wrong size makes the server reject the packet and close the socket
;      without an answer, which looks like "auth closed the connection without answering" on a
;      perfectly healthy authserver (this was the 1.1.3 bug - see README section 12).
;  ProbeMode = tcp   (weaker): only checks that the port accepts connections.
; ===========================================================================================

[authserver]
Enabled                  = true
Role                     = auth
WorkDir                  = ..\auth
Exe                      = authserver.exe
Args                     =
LogFile                  = auto
ServerConf               = configs\authserver.conf

; authserver logs so rarely that the log is not a usable health signal; leave it empty here
HeartbeatPattern         =
StartupReadyPattern      =

StartupTimeoutSeconds    = 300
StartupStallSeconds      = 300
StartupGraceSeconds      = 30
PollSeconds              = 15

StopGraceSeconds         = 20
RestartDelaySeconds      = 10
PlannedRestartDelaySeconds = 15
MaxBackoffSeconds        = 600
StableRunSeconds         = 300
AutoRestartOnCleanExit   = false
AdoptExisting            = true

CpuCrossCheck            = true

Console                  = shared

; 3724 = RealmServerPort in authserver.conf
ProbePort                = 3724
ProbeMode                = auth
ProbeHost                = 127.0.0.1
ProbeTimeoutMs           = 3000
ProbeFailuresBeforeRestart = 3
